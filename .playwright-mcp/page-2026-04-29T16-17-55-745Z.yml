        - generic [ref=e70]:
          - heading "Mr. Casteran Olivier" [level=3] [ref=e71]
          - paragraph [ref=e72]: "Mon parcours professionnel m'a conduit à de nombreuses expériences en France et à l'étranger, mais aussi dans la création de structures allant de 15 salariés à 120 salariés Je connais parfaitement les exigences de nos activités, la nécessaire collaboration étroite entre le cabinet Dentaire et le laboratoire. 30 ans d'exercice professionnel dans lequel je me suis beaucoup investi et accompli, Mon expérience, mon expertise, mes choix m'ont conduit a créer en 2017 DentCare Consultation pour répondre aux besoins du cabinet. Pour cela, je m'appuie sur deux sites productions: Hanoï (Vietnam), Bordeaux (France) Accompagner votre cabinet au quotidien dans tous les projets prothétiques, notre disponibilité , notre écoute , notre communication et notre proximité sont nos atouts. Mes équipes et moi-même sommes totalement investies et attachées à la qualité, au respect des procédures et des protocoles de travail, le laboratoire de Hanoï est certifié ISO 13485 Mon ambition est de produire de l'excellent travail pour un coût raisonné ."

        - text: Questions Fréquentes
        - heading "Trouvez les réponses à vos questions" [level=2] [ref=e402]
      - generic [ref=e403]:
        - generic [ref=e404]:
          - button "Quel est le délai de fabrication standard pour une prothèse?" [expanded] [ref=e405]:
            - generic [ref=e407]: Quel est le délai de fabrication standard pour une prothèse?
            - img [ref=e409]
          - region "Quel est le délai de fabrication standard pour une prothèse?" [ref=e411]:
            - paragraph [ref=e413]: Notre délai standard est de 14 jours ouvrables sur un flux traditionnel pour la plupart des prothèses, selon la complexité et les matériaux. Le flux numérique permet de traiter les commandes avec un délai de 10 jours. Nous coordonnons étroitement avec votre cabinet pour que les délais de production correspondent à vos agendas.
        - generic [ref=e414]:
          - button "Quels matériaux et marques DentCare utilise-t-il?" [ref=e415]:
            - generic [ref=e417]: Quels matériaux et marques DentCare utilise-t-il?
            - img [ref=e419]
          - region "Quels matériaux et marques DentCare utilise-t-il?":
            - paragraph [ref=e422]: "Nous travaillons exclusivement avec des matériaux de qualité premium et des marques reconnues : gammes de dents Vivodent SPE, Triumph, zircone haute performance, céramique lithium-disilicate E.max. Tous les matériaux proviennent de fournisseurs certifiés et respectent les normes ISO 13485 et FDA."
        - generic [ref=e423]:
          - button "Proposez-vous l'intégration du flux numérique avec scanners intra-oraux?" [ref=e424]:
            - generic [ref=e426]: Proposez-vous l'intégration du flux numérique avec scanners intra-oraux?
            - img [ref=e428]
          - region "Proposez-vous l'intégration du flux numérique avec scanners intra-oraux?":
            - paragraph [ref=e431]: "Oui, nous offrons une intégration complète du workflow numérique. Notre laboratoire de Bordeaux dispose également d’un service de scannage intégré pour la numérisation des empreintes. Nous acceptons les fichiers numériques des principaux scanners : TRIOS, iTero, Cerec Omnicam, et formats standards STL."
        - generic [ref=e432]:
          - button "DentCare est-il certifié pour la fabrication de dispositifs médicaux?" [ref=e433]:
            - generic [ref=e435]: DentCare est-il certifié pour la fabrication de dispositifs médicaux?
            - img [ref=e437]
          - region "DentCare est-il certifié pour la fabrication de dispositifs médicaux?":
            - paragraph [ref=e440]: Oui, notre site de production à Hanoï est certifié ISO 13485:2016, la norme internationale de système de management qualité pour dispositifs médicaux. Cette certification démontre notre engagement envers la qualité, la traçabilité et la conformité aux normes internationales les plus exigeantes. Toutes les prothèses respectent les exigences CE des dispositifs médicaux.
        - generic [ref=e441]:
          - button "DentCare peut-il gérer les cas implantaires complexes?" [ref=e442]:
            - generic [ref=e444]: DentCare peut-il gérer les cas implantaires complexes?
            - img [ref=e446]
          - region "DentCare peut-il gérer les cas implantaires complexes?":
            - paragraph [ref=e449]: Absolument. Notre équipe spécialisée en implantologie possède une vaste expérience des solutions transvissées, des bridges scellés, des réhabilitations all-on implants et des cas multi-implants complexes. Nous pouvons usiner des piliers personnalisés.
        - generic [ref=e450]:
          - button "Quelle garantie et support après-vente propose DentCare?" [ref=e451]:
            - generic [ref=e453]: Quelle garantie et support après-vente propose DentCare?
            - img [ref=e455]
          - region "Quelle garantie et support après-vente propose DentCare?":
            - paragraph [ref=e458]: Nous offrons une garantie de 3 ans contre les défauts de fabrication. La garantie couvre les défauts de matière et de fabrication, mais exclut les dommages liés à la manipulation ou au patient. Nous proposons des modifications rapides, réparations et service après-vente via notre laboratoire de coordination à Bordeaux.
        - generic [ref=e459]:
          - button "Comment DentCare assure-t-il la précision en conception numérique?" [ref=e460]:
            - generic [ref=e462]: Comment DentCare assure-t-il la précision en conception numérique?
            - img [ref=e464]
          - region "Comment DentCare assure-t-il la précision en conception numérique?":
            - paragraph [ref=e467]: Notre processus de conception numérique utilise des logiciels CAO avancés avec des bibliothèques spécialisées dentaires. Chaque conception est examinée par des techniciens expérimentés avant la production. Nous utilisons des équipements de fabrication précis et des contrôles qualité rigoureux. Chaque prothèse est inspectée avant expédition.
        - generic [ref=e468]:
          - button "DentCare livre-t-il à l'international?" [ref=e469]:
            - generic [ref=e471]: DentCare livre-t-il à l'international?
            - img [ref=e473]
          - region "DentCare livre-t-il à l'international?":
            - paragraph [ref=e476]: Oui, nous livrons en France et en Europe. Nous travaillons avec des partenaires logistiques réputés pour assurer une livraison sécurisée et rapide.
        - generic [ref=e477]:
          - button "Quelle est la différence entre zircone monolithique et stratifiée?" [ref=e478]:
            - generic [ref=e480]: Quelle est la différence entre zircone monolithique et stratifiée?
            - img [ref=e482]
          - region "Quelle est la différence entre zircone monolithique et stratifiée?":
            - paragraph [ref=e485]: La zircone monolithique offre une résistance supérieure et une résistance à la fracture — idéale pour les zones postérieures. La zircone stratifiée combine une armature zircone avec une céramique appliquée manuellement, offrant des résultats esthétiques exceptionnels avec translucidité et variation de teinte naturelle — parfaite pour les zones antérieures.
        - generic [ref=e486]:
          - button "DentCare peut-il accommoder des spécifications customisées pour les cas complexes?" [ref=e487]:
            - generic [ref=e489]: DentCare peut-il accommoder des spécifications customisées pour les cas complexes?
            - img [ref=e491]
          - region "DentCare peut-il accommoder des spécifications customisées pour les cas complexes?":
            - paragraph [ref=e494]: Oui, nous excellons dans le traitement des cas complexes et customisés. Nous encourageons la communication directe pendant la phase de conception pour garantir une correspondance parfaite avec vos exigences cliniques.
